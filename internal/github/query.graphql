query($owner: String!, $name: String!, $cursor: String, $me: String) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    pullRequests(states: OPEN, first: 100, after: $cursor) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number title url isDraft updatedAt headRefName headRefOid mergeable isCrossRepository
        author { __typename login avatarUrl }
        reviewRequests(first: 100) {
          nodes { requestedReviewer { __typename ... on User { login avatarUrl } ... on Team { slug } ... on EnterpriseTeam { slug } } }
        }
        reviews(last: 100) {
          nodes { id state submittedAt commit { oid } author { __typename login avatarUrl } }
        }
        mine: reviews(author: $me, last: 100) {
          nodes { id state submittedAt commit { oid } author { __typename login avatarUrl } }
        }
        statusCheckRollup { state }
      }
    }
  }
}
